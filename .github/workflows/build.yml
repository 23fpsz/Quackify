name: Build Quackify

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'app/**'
      - 'ui/**'
      - 'krespot-model/**'
      - 'krespot-core/**'
      - 'krespot-api/**'
      - 'krespot-library/**'
      - 'krespot-connect/**'
      - 'krespot-player/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - 'gradlew'
      - 'gradlew.bat'

  workflow_dispatch:
    inputs:
      flavor:
        description: 'Flavor to build'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'standard'
          - 'spotify'
          - 'apple'
      build_type:
        description: 'Build Type'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'debug'
          - 'release'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Decode Keystore
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
        run: |
          if [ -n "$RELEASE_KEYSTORE" ]; then
            printf "%s" "$RELEASE_KEYSTORE" | base64 -di > release.keystore
            echo "RELEASE_STORE_FILE=${GITHUB_WORKSPACE}/release.keystore" >> "$GITHUB_ENV"
            echo "Keystore decoded from secrets"
          else
            echo "Keystore secret is empty, the build falls back to debug signing"
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Determine Gradle Tasks
        id: gradle_tasks
        env:
          INPUT_FLAVOR: ${{ github.event.inputs.flavor }}
          INPUT_TYPE: ${{ github.event.inputs.build_type }}
        run: |
          FLAVOR="${INPUT_FLAVOR:-all}"
          TYPE="${INPUT_TYPE:-all}"

          capitalise() {
            printf '%s%s' "$(printf '%s' "$1" | cut -c1 | tr '[:lower:]' '[:upper:]')" "$(printf '%s' "$1" | cut -c2-)"
          }

          if [ "$FLAVOR" = "all" ] && [ "$TYPE" = "all" ]; then
            TASKS="assemble"
          elif [ "$FLAVOR" = "all" ]; then
            TASKS="assemble$(capitalise "$TYPE")"
          elif [ "$TYPE" = "all" ]; then
            TASKS="assemble$(capitalise "$FLAVOR")"
          else
            TASKS="assemble$(capitalise "$FLAVOR")$(capitalise "$TYPE")"
          fi

          echo "Selected tasks: $TASKS"
          echo "tasks=$TASKS" >> "$GITHUB_OUTPUT"

      - name: Build APKs with Gradle
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew ${{ steps.gradle_tasks.outputs.tasks }} --stacktrace

      - name: Collect Generated APKs
        run: |
          set -euo pipefail
          mkdir -p apk_output
          if [ ! -d app/build/outputs/apk ]; then
            echo "::error::Gradle did not create app/build/outputs/apk"
            exit 1
          fi
          find app/build/outputs/apk -type f -name '*.apk' ! -name '*-unsigned.apk' -exec cp {} apk_output/ \;
          COUNT=$(find apk_output -maxdepth 1 -type f -name '*.apk' | wc -l)
          echo "Collected APKs: $COUNT"
          ls -la apk_output/
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::Gradle produced no signed APK"
            exit 1
          fi

      - name: Upload APKs as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Quackify-Compose-APKs
          path: apk_output/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Prepare Release Info
        id: release_info
        run: |
          VERSION_NAME=$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -n 1)
          if [ -z "$VERSION_NAME" ]; then
            VERSION_NAME="1.0.0"
          fi
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          TAG="v${VERSION_NAME}-b${{ github.run_number }}-${SHORT_SHA}"
          TITLE="Quackify v${VERSION_NAME} (Build #${{ github.run_number }} - ${SHORT_SHA})"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: ${{ steps.release_info.outputs.title }}
          body: |
            ### 📱 Quackify Build
            - **Commit:** [${{ steps.release_info.outputs.short_sha }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
            - **Branch:** `${{ github.ref_name }}`
            - **Build Run:** [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

            ### 📦 Available Editions:
            - **Standard**: `Quackify-v*-standard-*.apk` (`com.quackify.app`)
            - **Spotify Island**: `Quackify-v*-spotify-*.apk` (`com.spotify.music`)
            - **Apple Island**: `Quackify-v*-apple-*.apk` (`com.apple.android.music`)
          files: apk_output/*.apk
          prerelease: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
