name: Build Quackify

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'app/**'
      - 'ui/**'
      - 'krespot-model/**'
      - 'krespot-core/**'
      - 'krespot-api/**'
      - 'krespot-library/**'
      - 'krespot-connect/**'
      - 'krespot-player/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - 'gradlew'
      - 'gradlew.bat'

  pull_request:
    branches: [ "main", "master" ]

  workflow_dispatch:
    inputs:
      flavor:
        description: 'Flavor to build'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'standard'
          - 'spotify'
          - 'apple'
      build_type:
        description: 'Build Type'
        required: true
        default: 'release'
        type: choice
        options:
          - 'all'
          - 'release'
          - 'debug'
      create_draft:
        description: 'Create a Draft Release on GitHub'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Decode Keystore
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
        run: |
          if [ -n "$RELEASE_KEYSTORE" ]; then
            printf "%s" "$RELEASE_KEYSTORE" | base64 -di > release.keystore
            echo "RELEASE_STORE_FILE=${GITHUB_WORKSPACE}/release.keystore" >> "$GITHUB_ENV"
            echo "Keystore decoded from secrets"
          else
            echo "Keystore secret is empty, the build falls back to debug signing"
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Determine Gradle Tasks
        id: gradle_tasks
        env:
          INPUT_FLAVOR: ${{ github.event.inputs.flavor }}
          INPUT_TYPE: ${{ github.event.inputs.build_type }}
        run: |
          # Fast-path verification for Pull Requests
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "tasks=assembleStandardDebug" >> "$GITHUB_OUTPUT"
            echo "Selected tasks: assembleStandardDebug (PR check)"
            exit 0
          fi

          # Automated pushes build only release variants
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tasks=assembleRelease" >> "$GITHUB_OUTPUT"
            echo "Selected tasks: assembleRelease (automated push)"
            exit 0
          fi

          # Manual runs (workflow_dispatch) follow user selection
          FLAVOR="${INPUT_FLAVOR:-all}"
          TYPE="${INPUT_TYPE:-release}"

          capitalise() {
            printf '%s%s' "$(printf '%s' "$1" | cut -c1 | tr '[:lower:]' '[:upper:]')" "$(printf '%s' "$1" | cut -c2-)"
          }

          if [ "$FLAVOR" = "all" ] && [ "$TYPE" = "all" ]; then
            TASKS="assemble"
          elif [ "$FLAVOR" = "all" ]; then
            TASKS="assemble$(capitalise "$TYPE")"
          elif [ "$TYPE" = "all" ]; then
            TASKS="assemble$(capitalise "$FLAVOR")"
          else
            TASKS="assemble$(capitalise "$FLAVOR")$(capitalise "$TYPE")"
          fi

          echo "Selected tasks: $TASKS"
          echo "tasks=$TASKS" >> "$GITHUB_OUTPUT"

      - name: Build APKs with Gradle
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew ${{ steps.gradle_tasks.outputs.tasks }} --stacktrace

      - name: Collect Generated APKs & Checksums
        run: |
          set -euo pipefail
          mkdir -p apk_output
          find app/build/outputs/apk -type f -name '*.apk' ! -name '*-unsigned.apk' -exec cp {} apk_output/ \;
          COUNT=$(find apk_output -maxdepth 1 -type f -name '*.apk' | wc -l)
          echo "Collected APKs: $COUNT"
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::Gradle produced no signed APK"
            exit 1
          fi

          # Generate SHA-256 Checksums for artifacts
          cd apk_output
          sha256sum *.apk > sha256_checksums.txt
          cat sha256_checksums.txt
          cd ..

      # Individual Artifact Uploads (Download only the ~3.9MB APK you need)
      - name: Upload Standard Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Quackify-Standard-Release
          path: apk_output/*standard*release*.apk
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Spotify Island Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Quackify-Spotify-Release
          path: apk_output/*spotify*release*.apk
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Apple Island Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Quackify-Apple-Release
          path: apk_output/*apple*release*.apk
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Standard Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Quackify-Standard-Debug
          path: apk_output/*standard*debug*.apk
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Spotify Island Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Quackify-Spotify-Debug
          path: apk_output/*spotify*debug*.apk
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Apple Island Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Quackify-Apple-Debug
          path: apk_output/*apple*debug*.apk
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Checksums
        uses: actions/upload-artifact@v4
        with:
          name: Quackify-Checksums
          path: apk_output/sha256_checksums.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Prepare Release Info
        id: release_info
        if: ${{ github.event_name != 'pull_request' && (github.event_name == 'push' || github.event.inputs.create_draft == 'true') }}
        run: |
          VERSION_NAME=$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -n 1)
          if [ -z "$VERSION_NAME" ]; then
            VERSION_NAME="1.0.0"
          fi
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          TAG="v${VERSION_NAME}-b${{ github.run_number }}-${SHORT_SHA}"
          TITLE="Quackify v${VERSION_NAME} (Draft #${{ github.run_number }})"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Draft Release
        if: ${{ steps.release_info.outputs.tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: ${{ steps.release_info.outputs.title }}
          draft: true
          prerelease: false
          body: |
            ### 📝 What's Changed
            <!-- Add release notes or changelog here before publishing -->
            - 

            ---
            > [!NOTE]
            > All app variants are functionally identical in features and code. The only difference is the package name (Application ID) to allow side-by-side installations on your device:
            > - **Standard**: `com.quackify.app`
            > - **Spotify Island**: `com.spotify.music`
            > - **Apple Island**: `com.apple.android.music`

            ### 🔍 Build Info:
            - **Commit:** [${{ steps.release_info.outputs.short_sha }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
            - **Workflow Run:** [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          files: apk_output/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
