# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Daemon JVM: more heap + parallel GC keeps big module graphs compiling fast
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8

# Run tasks of independent modules in parallel (8-module build)
org.gradle.parallel=true

# Reuse task outputs between builds
org.gradle.caching=true

# Skip the configuration phase when build scripts have not changed
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true

# Keep the Kotlin daemon well fed so it is not restarted mid-build
kotlin.daemon.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m
kotlin.incremental=true

# AndroidX is required; lifecycle-aware caching flags
android.useAndroidX=true
android.enableJetifier=false

# Non-transitive R classes and faster resource processing
android.nonTransitiveRClass=true
android.nonFinalResIds=false

# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
android.disallowKotlinSourceSets=false
